# 项目信息
site_name: Menglei Liang
site_author: Menglei Liang
site_description: Menglei Liang — PhD student working on methane remote sensing, scientific machine learning, and greenhouse-gas monitoring.
site_url: https://emeric53.github.io/

# 代码仓库信息
repo_name: Emeric53/Emeric53.github.io
repo_url: https://github.com/Emeric53/Emeric53.github.io/

# 版权信息
copyright: Copyright &copy; 2024 ~ now | 🦩 Menglei Liang

theme:
  name: material
  language: zh
  custom_dir: overrides
  favicon: assets/images/favicon.svg
  icon:
    logo: material/satellite-variant
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.sections
    - toc.follow
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - content.tooltips
    - navigation.tracking
    - navigation.footer
    - navigation.file_type_icons
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font: false

# Social Links
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Emeric53
    - icon: fontawesome/solid/envelope
      link: mailto:mliang3@albany.edu

# Plugins
plugins: 
  - search:
      lang:
        - en
        - zh
  - awesome-pages
  - glightbox
  - git-revision-date-localized:
      type: timeago
      locale: zh
      enable_creation_date: true
      enable_git_follow: false
      fallback_to_build_date: true
  - minify:
      minify_html: true

# Extra Configuration
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/pangu@4.0.7/dist/browser/pangu.min.js
  - javascripts/pangu_init.js

extra_css:
  - stylesheets/academic.css

# Markdown Extensions
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
