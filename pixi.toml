[workspace]
name = "emeric53-github-io"
version = "0.1.0"
description = "Emeric53's personal website"
authors = ["Emeric53"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.10.*"

[tasks]
deploy = "mkdocs gh-deploy --force"
# PYTHONDONTWRITEBYTECODE：避免 hook 生成 .pyc 触发 mkdocs serve 的重载循环
start = { cmd = "mkdocs serve", env = { PYTHONDONTWRITEBYTECODE = "1" } }
build = "mkdocs build"

[pypi-dependencies]
mkdocs = ">=1.6.1, <2"
mkdocs-minify-plugin = ">=0.8.0, <1"
