# 项目信息
site_name: Menglei Liang
site_author: Menglei Liang
site_description: Menglei Liang — PhD student working on methane remote sensing, scientific machine learning, and greenhouse-gas monitoring.
site_url: https://emeric53.github.io/

# 代码仓库信息
repo_name: Emeric53/Emeric53.github.io
repo_url: https://github.com/Emeric53/Emeric53.github.io/

# 版权信息
copyright: Copyright &copy; 2024 ~ now | 🦩 Menglei Liang

theme:
  name: material
  language: en
  custom_dir: overrides
  favicon: assets/images/favicon.svg
  icon:
    logo: material/satellite-variant
    repo: fontawesome/brands/github
  features:
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font: false

# Social Links
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Emeric53
    - icon: fontawesome/solid/envelope
      link: mailto:mliang3@albany.edu

# Plugins
plugins:
  - minify:
      minify_html: true

# Extra Configuration
extra_css:
  - stylesheets/academic.css

exclude_docs: |
  academic/
  stylesheets/index.md

nav:
  - Home: index.md
  - Research: research.md
  - Publications: publications.md
  - About: about/index.md

# Markdown Extensions
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
